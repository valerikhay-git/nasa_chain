<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wireframe cards · user management</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #f6f9fc 0%, #eef2f5 100%);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* User Management Panel */
    .user-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 2px solid #cbd5e1;
      border-radius: 20px;
      padding: 1.2rem;
      z-index: 200;
      width: 320px;
      box-shadow: 0 12px 28px -12px rgba(0, 0, 0, 0.2);
    }

    .user-panel h3 {
      font-size: 1rem;
      color: #334155;
      margin-bottom: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .user-panel h3::before {
      content: '👥';
      font-size: 1.2rem;
    }

    .user-list {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 0.5rem;
    }

    .user-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem;
      border-bottom: 1px solid #e2e8f0;
      font-size: 0.9rem;
    }

    .user-item:last-child {
      border-bottom: none;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      font-weight: 600;
      color: #0f172a;
    }

    .user-desc {
      font-size: 0.75rem;
      color: #64748b;
    }

    .delete-user {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .delete-user:hover {
      background: #fee2e2;
      transform: scale(1.1);
    }

    .add-user-form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .add-user-form input {
      padding: 0.6rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: inherit;
    }

    .add-user-form input:focus {
      outline: none;
      border-color: #94a3b8;
    }

    .add-user-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 30px;
      padding: 0.6rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
    }

    .add-user-btn:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
    }

    /* Main container */
    .pan-container {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }

    .pan-container.panning {
      cursor: grabbing;
    }

    .tree-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: 0 0;
      will-change: transform;
      transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    }

    .tree-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      min-width: max-content;
      min-height: max-content;
      padding: 10rem;
    }

    /* Wireframe card */
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid #cbd5e1;
      border-radius: 20px;
      box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.1);
      padding: 1.2rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      transition: all 0.2s;
      width: 300px;
      position: relative;
      z-index: 10;
      margin: 0 1rem;
    }

    .card:hover {
      border-color: #94a3b8;
      box-shadow: 0 12px 28px -12px rgba(0, 0, 0, 0.2);
      transform: scale(1.02);
      background: white;
    }

    .pfp-placeholder {
      width: 70px;
      height: 70px;
      background: #e2e8f0;
      border: 2px dashed #94a3b8;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .pfp-placeholder::before {
      content: 'PFP';
      opacity: 0.6;
    }

    .card-content {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      flex: 1;
    }

    .name {
      font-weight: 700;
      font-size: 1.2rem;
      color: #0f172a;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .description {
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 400;
      margin-bottom: 0.5rem;
      font-style: italic;
    }

    .expand-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 30px;
      padding: 0.3rem 1rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      width: fit-content;
      z-index: 20;
    }

    .expand-btn:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
      transform: scale(1.05);
    }

    .children-wrapper {
      display: flex;
      justify-content: center;
      gap: 4rem;
      margin-top: 3rem;
      position: relative;
      width: 100%;
    }

    .child-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      min-width: 300px;
    }

    .connector-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .card-appear {
      animation: popIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.7) translateY(15px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .card.max-depth .expand-btn {
      opacity: 0.4;
      pointer-events: none;
    }

    .lost-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: white;
      backdrop-filter: blur(8px);
      padding: 0.75rem 1.5rem;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 500;
      color: #1f2a44;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0,0,0,0.05);
      border: none;
      cursor: pointer;
      z-index: 100;
      transition: all 0.2s ease;
    }

    .lost-button:hover {
      background: #f0f4fe;
      transform: scale(1.05);
    }

    .lost-button::before {
      content: '🧭';
      margin-right: 8px;
    }

    .tree-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(148, 163, 184, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.1) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <!-- User Management Panel -->
  <div class="user-panel" id="userPanel">
    <h3>User Management</h3>
    
    <div class="user-list" id="userList">
      <!-- Users will be dynamically added here -->
    </div>

    <div class="add-user-form">
      <input type="text" id="newUserName" placeholder="Name (e.g., Alex Chen)" value="New User">
      <input type="text" id="newUserDesc" placeholder="Description (e.g., Product Manager)" value="Team Member">
      <button class="add-user-btn" id="addUserBtn">
        <span>➕</span> Add New User
      </button>
    </div>
  </div>

  <div class="pan-container" id="panContainer">
    <div class="tree-wrapper" id="treeWrapper">
      <div class="tree-container" id="treeContainer">
        <canvas class="connector-canvas" id="connectorCanvas"></canvas>
      </div>
    </div>
  </div>
  
  <button class="lost-button" id="lostButton">You are Lost?</button>

  <script>
    (function() {
      const MAX_DEPTH = 3;
      
      // ===== EASY USER MANAGEMENT =====
      // Just add or remove from this array!
      let userDatabase = [
        { name: 'Alex Chen', desc: 'Product Designer' },
        { name: 'Jordan Lee', desc: 'Dev Advocate' },
        { name: 'Taylor Smith', desc: 'UX Researcher' },
        { name: 'Casey Kim', desc: 'Frontend Dev' },
        { name: 'Riley Patel', desc: 'Product Manager' },
        { name: 'Morgan James', desc: 'UI Engineer' },
        { name: 'Avery Wong', desc: 'Design Lead' },
        { name: 'Quinn Davis', desc: 'Full Stack' },
        { name: 'Sage Miller', desc: 'Creative Dir' },
        { name: 'Blake Wilson', desc: 'Tech Lead' }
      ];

      // ===== Helper functions =====
      function getAllUserNames() {
        return userDatabase.map(u => u.name);
      }

      function getRandomUser() {
        return userDatabase[Math.floor(Math.random() * userDatabase.length)];
      }

      function getRandomUserName(excludeNames = []) {
        const available = userDatabase.filter(u => !excludeNames.includes(u.name));
        if (available.length === 0) return userDatabase[0];
        return available[Math.floor(Math.random() * available.length)].name;
      }

      function getRandomUserDesc(name) {
        const user = userDatabase.find(u => u.name === name);
        return user ? user.desc : 'Team Member';
      }

      // Store all cards and their relationships
      const cardRelationships = new Map();
      let canvas, ctx;
      let animationFrame;

      // Panning variables
      const panContainer = document.getElementById('panContainer');
      const treeWrapper = document.getElementById('treeWrapper');
      let isPanning = false;
      let startX, startY;
      let translateX = 0, translateY = 0;

      // ===== UI Functions =====
      function updateUserListUI() {
        const userList = document.getElementById('userList');
        userList.innerHTML = '';
        
        userDatabase.forEach((user, index) => {
          const userItem = document.createElement('div');
          userItem.className = 'user-item';
          userItem.innerHTML = `
            <div class="user-info">
              <span class="user-name">${user.name}</span>
              <span class="user-desc">${user.desc}</span>
            </div>
            <button class="delete-user" data-index="${index}">✕</button>
          `;
          userList.appendChild(userItem);
        });

        // Add delete handlers
        document.querySelectorAll('.delete-user').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const index = parseInt(btn.dataset.index);
            deleteUser(index);
          });
        });
      }

      function addUser(name, desc) {
        if (name && desc) {
          userDatabase.push({ name, desc });
          updateUserListUI();
        }
      }

      function deleteUser(index) {
        if (index >= 0 && index < userDatabase.length) {
          userDatabase.splice(index, 1);
          updateUserListUI();
        }
      }

      // Reset view to center
      function resetToRoot() {
        translateX = 0;
        translateY = 0;
        treeWrapper.style.transform = `translate(0px, 0px)`;
        setTimeout(updateConnectors, 500);
      }

      // Pan functionality
      function initPanning() {
        panContainer.addEventListener('mousedown', startPan);
        document.addEventListener('mousemove', pan);
        document.addEventListener('mouseup', stopPan);
        document.addEventListener('dragstart', (e) => e.preventDefault());

        const lostButton = document.getElementById('lostButton');
        lostButton.addEventListener('click', resetToRoot);

        // Add user button handler
        document.getElementById('addUserBtn').addEventListener('click', () => {
          const nameInput = document.getElementById('newUserName');
          const descInput = document.getElementById('newUserDesc');
          addUser(nameInput.value.trim(), descInput.value.trim());
        });
      }

      function startPan(e) {
        if (e.target.closest('.expand-btn') || e.target.closest('.lost-button') || e.target.closest('.add-user-btn') || e.target.closest('.delete-user')) return;
        
        isPanning = true;
        panContainer.classList.add('panning');
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
        
        treeWrapper.style.transition = 'none';
        e.preventDefault();
      }

      function pan(e) {
        if (!isPanning) return;
        
        e.preventDefault();
        
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        
        treeWrapper.style.transform = `translate(${translateX}px, ${translateY}px)`;
        
        if (!animationFrame) {
          animationFrame = requestAnimationFrame(() => {
            drawConnectors();
            animationFrame = null;
          });
        }
      }

      function stopPan() {
        isPanning = false;
        panContainer.classList.remove('panning');
        treeWrapper.style.transition = 'transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1)';
      }

      // Canvas setup
      function setupCanvas() {
        canvas = document.getElementById('connectorCanvas');
        ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
          const container = document.getElementById('treeContainer');
          const rect = container.getBoundingClientRect();
          
          canvas.width = rect.width;
          canvas.height = rect.height;
          canvas.style.width = rect.width + 'px';
          canvas.style.height = rect.height + 'px';
          
          drawConnectors();
        }

        const resizeObserver = new ResizeObserver(() => {
          resizeCanvas();
        });
        
        resizeObserver.observe(document.getElementById('treeContainer'));
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
      }

      function drawConnectors() {
        if (!ctx) return;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 3]);
        
        const container = document.getElementById('treeContainer');
        const containerRect = container.getBoundingClientRect();
        
        for (const [childCard, relationship] of cardRelationships) {
          const parentCard = relationship.parent;
          if (!parentCard) continue;
          
          const parentRect = parentCard.getBoundingClientRect();
          const childRect = childCard.getBoundingClientRect();
          
          const parentX = parentRect.left + parentRect.width / 2 - containerRect.left;
          const parentY = parentRect.bottom - containerRect.top;
          
          const childX = childRect.left + childRect.width / 2 - containerRect.left;
          const childY = childRect.top - containerRect.top;
          
          const margin = 100;
          if (parentY > -margin && parentY < canvas.height + margin &&
              childY > -margin && childY < canvas.height + margin) {
            
            const midY = parentY + (childY - parentY) * 0.3;
            
            ctx.beginPath();
            
            ctx.moveTo(parentX, parentY);
            ctx.lineTo(parentX, midY);
            
            const siblingCards = Array.from(cardRelationships.entries())
              .filter(([_, rel]) => rel.parent === parentCard)
              .map(([card, rel]) => ({ card, isFirst: rel.isFirstChild }));
            
            if (siblingCards.length === 2) {
              const sibling1 = siblingCards[0].card;
              const sibling2 = siblingCards[1].card;
              
              const rect1 = sibling1.getBoundingClientRect();
              const rect2 = sibling2.getBoundingClientRect();
              
              const x1 = rect1.left + rect1.width / 2 - containerRect.left;
              const x2 = rect2.left + rect2.width / 2 - containerRect.left;
              
              ctx.moveTo(Math.min(x1, x2), midY);
              ctx.lineTo(Math.max(x1, x2), midY);
            }
            
            ctx.moveTo(parentX, midY);
            ctx.lineTo(childX, midY);
            ctx.moveTo(childX, midY);
            ctx.lineTo(childX, childY);
            
            ctx.stroke();
          }
        }
      }

      function updateConnectors() {
        if (animationFrame) {
          cancelAnimationFrame(animationFrame);
        }
        animationFrame = requestAnimationFrame(() => {
          drawConnectors();
          animationFrame = null;
        });
      }

      function registerRelationship(childCard, parentCard, isFirstChild = false) {
        cardRelationships.set(childCard, { parent: parentCard, isFirstChild });
        updateConnectors();
      }

      function unregisterRelationship(childCard) {
        cardRelationships.delete(childCard);
        updateConnectors();
      }

      function createCard(depth = 0, customName = null, customDesc = null, parentCard = null, isFirstChild = false) {
        const card = document.createElement('div');
        card.className = 'card card-appear';
        if (depth >= MAX_DEPTH) card.classList.add('max-depth');

        // Left square placeholder
        const pfpPlaceholder = document.createElement('div');
        pfpPlaceholder.className = 'pfp-placeholder';

        // Right content
        const content = document.createElement('div');
        content.className = 'card-content';

        // Name
        const nameSpan = document.createElement('div');
        nameSpan.className = 'name';
        const name = customName || getRandomUserName();
        nameSpan.textContent = name;

        // Description
        const descSpan = document.createElement('div');
        descSpan.className = 'description';
        const desc = customDesc || getRandomUserDesc(name);
        descSpan.textContent = desc;

        // Expand button
        const btn = document.createElement('button');
        btn.className = 'expand-btn';
        btn.innerHTML = '<span class="btn-icon">⤵</span> Expand';

        content.appendChild(nameSpan);
        content.appendChild(descSpan);
        content.appendChild(btn);
        
        card.appendChild(pfpPlaceholder);
        card.appendChild(content);

        card.dataset.depth = depth;
        card.dataset.name = name;
        card.dataset.desc = desc;

        if (parentCard) {
          registerRelationship(card, parentCard, isFirstChild);
        }

        const observer = new MutationObserver(() => {
          updateConnectors();
        });
        
        observer.observe(card, {
          attributes: true,
          attributeFilter: ['style', 'class']
        });

        btn.addEventListener('click', function onClick(e) {
          e.stopPropagation();
          e.preventDefault();

          const currentDepth = parseInt(card.dataset.depth, 10);
          
          const nextElement = card.nextElementSibling;
          if (nextElement && nextElement.classList.contains('children-wrapper')) {
            const childUnits = nextElement.querySelectorAll('.child-unit');
            childUnits.forEach(unit => {
              const childCard = unit.querySelector('.card');
              if (childCard) {
                unregisterRelationship(childCard);
              }
            });
            nextElement.remove();
            updateConnectors();
            return;
          }

          if (currentDepth >= MAX_DEPTH) return;

          const wrapper = document.createElement('div');
          wrapper.className = 'children-wrapper';

          const parentName = card.dataset.name;
          const usedNames = [parentName];

          for (let i = 0; i < 2; i++) {
            const unit = document.createElement('div');
            unit.className = 'child-unit';
            
            let childName = getRandomUserName(usedNames);
            usedNames.push(childName);
            
            const childDesc = getRandomUserDesc(childName);
            
            const childCard = createCard(currentDepth + 1, childName, childDesc, card, i === 0);
            unit.appendChild(childCard);
            wrapper.appendChild(unit);
          }

          card.insertAdjacentElement('afterend', wrapper);
          updateConnectors();
        });

        return card;
      }

      // Initialize
      function init() {
        const container = document.getElementById('treeContainer');
        container.innerHTML = '<canvas class="connector-canvas" id="connectorCanvas"></canvas>';
        
        setupCanvas();
        initPanning();
        updateUserListUI();
        
        const rootCard = createCard(0, 'You', 'Root User');
        rootCard.classList.add('root-card');
        container.appendChild(rootCard);
        
        updateConnectors();
      }

      // Start the app
      init();
    })();
  </script>
</body>
</html>
