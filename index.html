<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wireframe cards · infinite pan</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #f6f9fc 0%, #eef2f5 100%);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* Main container - fills viewport and handles panning */
    .pan-container {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }

    .pan-container.panning {
      cursor: grabbing;
    }

    /* Content wrapper that gets transformed for panning */
    .tree-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: 0 0;
      will-change: transform;
      transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    }

    /* Center the root card in the view */
    .tree-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      min-width: max-content;
      min-height: max-content;
      padding: 10rem;
    }

    /* Wireframe card - rectangular with left square and right text */
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid #cbd5e1;
      border-radius: 20px;
      box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.1);
      padding: 1.2rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      transition: all 0.2s;
      width: 280px;
      position: relative;
      z-index: 10;
      margin: 0 1rem;
    }

    .card:hover {
      border-color: #94a3b8;
      box-shadow: 0 12px 28px -12px rgba(0, 0, 0, 0.2);
      transform: scale(1.02);
      background: white;
    }

    /* Left square placeholder for PFP */
    .pfp-placeholder {
      width: 70px;
      height: 70px;
      background: #e2e8f0;
      border: 2px dashed #94a3b8;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .pfp-placeholder::before {
      content: 'PFP';
      opacity: 0.6;
    }

    /* Right side content */
    .card-content {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      flex: 1;
    }

    /* Name */
    .name {
      font-weight: 700;
      font-size: 1.2rem;
      color: #0f172a;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    /* Description text (smaller) */
    .description {
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 400;
      margin-bottom: 0.5rem;
      font-style: italic;
    }

    /* Expand button - small and minimal */
    .expand-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 30px;
      padding: 0.3rem 1rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      width: fit-content;
      z-index: 20;
    }

    .expand-btn:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
      transform: scale(1.05);
    }

    .expand-btn:active {
      transform: scale(0.95);
    }

    .btn-icon {
      font-size: 1rem;
      line-height: 1;
    }

    /* Children wrapper */
    .children-wrapper {
      display: flex;
      justify-content: center;
      gap: 4rem;
      margin-top: 3rem;
      position: relative;
      width: 100%;
    }

    .child-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      min-width: 280px;
    }

    /* canvas for dynamic lines */
    .connector-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .card-appear {
      animation: popIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.7) translateY(15px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .card.max-depth .expand-btn {
      opacity: 0.4;
      pointer-events: none;
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    /* Lost button */
    .lost-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: white;
      backdrop-filter: blur(8px);
      padding: 0.75rem 1.5rem;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 500;
      color: #1f2a44;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0,0,0,0.05);
      border: none;
      cursor: pointer;
      z-index: 100;
      transition: all 0.2s ease;
      letter-spacing: -0.01em;
    }

    .lost-button:hover {
      background: #f0f4fe;
      transform: scale(1.05);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
    }

    .lost-button:active {
      transform: scale(0.95);
    }

    .lost-button::before {
      content: '🧭';
      margin-right: 8px;
      font-size: 1.1rem;
    }

    /* Grid background */
    .tree-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(148, 163, 184, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.1) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    @media (max-width: 640px) {
      .children-wrapper {
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="pan-container" id="panContainer">
    <div class="tree-wrapper" id="treeWrapper">
      <div class="tree-container" id="treeContainer">
        <canvas class="connector-canvas" id="connectorCanvas"></canvas>
      </div>
    </div>
  </div>
  
  <button class="lost-button" id="lostButton">You are Lost?</button>

  <script>
    (function() {
      const MAX_DEPTH = 3;
      
      // Sample names and descriptions
      const names = ['Alex Chen', 'Jordan Lee', 'Taylor Smith', 'Casey Kim', 'Riley Patel', 'Morgan James', 'Avery Wong', 'Quinn Davis', 'Sage Miller', 'Blake Wilson'];
      const descriptions = ['Product Designer', 'Dev Advocate', 'UX Researcher', 'Frontend Dev', 'Product Manager', 'UI Engineer', 'Design Lead', 'Full Stack', 'Creative Dir', 'Tech Lead'];

      // Store all cards and their relationships
      const cardRelationships = new Map();
      let canvas, ctx;
      let animationFrame;

      // Panning variables
      const panContainer = document.getElementById('panContainer');
      const treeWrapper = document.getElementById('treeWrapper');
      let isPanning = false;
      let startX, startY;
      let translateX = 0, translateY = 0;

      function randomName() {
        return names[Math.floor(Math.random() * names.length)];
      }

      function randomDescription() {
        return descriptions[Math.floor(Math.random() * descriptions.length)];
      }

      // Reset view to center on root card
      function resetToRoot() {
        translateX = 0;
        translateY = 0;
        treeWrapper.style.transform = `translate(0px, 0px)`;
        setTimeout(updateConnectors, 500);
      }

      // Pan functionality
      function initPanning() {
        panContainer.addEventListener('mousedown', startPan);
        document.addEventListener('mousemove', pan);
        document.addEventListener('mouseup', stopPan);
        document.addEventListener('dragstart', (e) => e.preventDefault());

        const lostButton = document.getElementById('lostButton');
        lostButton.addEventListener('click', resetToRoot);
      }

      function startPan(e) {
        if (e.target.closest('.expand-btn') || e.target.closest('.lost-button')) return;
        
        isPanning = true;
        panContainer.classList.add('panning');
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
        
        treeWrapper.style.transition = 'none';
        e.preventDefault();
      }

      function pan(e) {
        if (!isPanning) return;
        
        e.preventDefault();
        
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        
        treeWrapper.style.transform = `translate(${translateX}px, ${translateY}px)`;
        
        if (!animationFrame) {
          animationFrame = requestAnimationFrame(() => {
            drawConnectors();
            animationFrame = null;
          });
        }
      }

      function stopPan() {
        isPanning = false;
        panContainer.classList.remove('panning');
        treeWrapper.style.transition = 'transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1)';
      }

      function setupCanvas() {
        canvas = document.getElementById('connectorCanvas');
        ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
          const container = document.getElementById('treeContainer');
          const rect = container.getBoundingClientRect();
          
          canvas.width = rect.width;
          canvas.height = rect.height;
          canvas.style.width = rect.width + 'px';
          canvas.style.height = rect.height + 'px';
          
          drawConnectors();
        }

        const resizeObserver = new ResizeObserver(() => {
          resizeCanvas();
        });
        
        resizeObserver.observe(document.getElementById('treeContainer'));
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
      }

      function drawConnectors() {
        if (!ctx) return;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 3]); // Dashed lines for wireframe feel
        
        const container = document.getElementById('treeContainer');
        const containerRect = container.getBoundingClientRect();
        
        for (const [childCard, relationship] of cardRelationships) {
          const parentCard = relationship.parent;
          if (!parentCard) continue;
          
          const parentRect = parentCard.getBoundingClientRect();
          const childRect = childCard.getBoundingClientRect();
          
          const parentX = parentRect.left + parentRect.width / 2 - containerRect.left;
          const parentY = parentRect.bottom - containerRect.top;
          
          const childX = childRect.left + childRect.width / 2 - containerRect.left;
          const childY = childRect.top - containerRect.top;
          
          const margin = 100;
          if (parentY > -margin && parentY < canvas.height + margin &&
              childY > -margin && childY < canvas.height + margin) {
            
            const midY = parentY + (childY - parentY) * 0.3;
            
            ctx.beginPath();
            
            // Draw vertical line from parent
            ctx.moveTo(parentX, parentY);
            ctx.lineTo(parentX, midY);
            
            // Get sibling cards
            const siblingCards = Array.from(cardRelationships.entries())
              .filter(([_, rel]) => rel.parent === parentCard)
              .map(([card, rel]) => ({ card, isFirst: rel.isFirstChild }));
            
            if (siblingCards.length === 2) {
              const sibling1 = siblingCards[0].card;
              const sibling2 = siblingCards[1].card;
              
              const rect1 = sibling1.getBoundingClientRect();
              const rect2 = sibling2.getBoundingClientRect();
              
              const x1 = rect1.left + rect1.width / 2 - containerRect.left;
              const x2 = rect2.left + rect2.width / 2 - containerRect.left;
              
              // Draw horizontal line
              ctx.moveTo(Math.min(x1, x2), midY);
              ctx.lineTo(Math.max(x1, x2), midY);
            }
            
            // Draw vertical line to child
            ctx.moveTo(parentX, midY);
            ctx.lineTo(childX, midY);
            ctx.moveTo(childX, midY);
            ctx.lineTo(childX, childY);
            
            ctx.stroke();
          }
        }
      }

      function updateConnectors() {
        if (animationFrame) {
          cancelAnimationFrame(animationFrame);
        }
        animationFrame = requestAnimationFrame(() => {
          drawConnectors();
          animationFrame = null;
        });
      }

      function registerRelationship(childCard, parentCard, isFirstChild = false) {
        cardRelationships.set(childCard, { parent: parentCard, isFirstChild });
        updateConnectors();
      }

      function unregisterRelationship(childCard) {
        cardRelationships.delete(childCard);
        updateConnectors();
      }

      function createCard(depth = 0, customName = null, customDesc = null, parentCard = null, isFirstChild = false) {
        const card = document.createElement('div');
        card.className = 'card card-appear';
        if (depth >= MAX_DEPTH) card.classList.add('max-depth');

        // Left square placeholder
        const pfpPlaceholder = document.createElement('div');
        pfpPlaceholder.className = 'pfp-placeholder';

        // Right content container
        const content = document.createElement('div');
        content.className = 'card-content';

        // Name
        const nameSpan = document.createElement('div');
        nameSpan.className = 'name';
        const name = customName || randomName();
        nameSpan.textContent = name;

        // Description
        const descSpan = document.createElement('div');
        descSpan.className = 'description';
        const desc = customDesc || randomDescription();
        descSpan.textContent = desc;

        // Expand button
        const btn = document.createElement('button');
        btn.className = 'expand-btn';
        btn.innerHTML = '<span class="btn-icon">⤵</span> Expand';

        // Assemble card
        content.appendChild(nameSpan);
        content.appendChild(descSpan);
        content.appendChild(btn);
        
        card.appendChild(pfpPlaceholder);
        card.appendChild(content);

        card.dataset.depth = depth;
        card.dataset.name = name;
        card.dataset.desc = desc;

        if (parentCard) {
          registerRelationship(card, parentCard, isFirstChild);
        }

        // Watch for position changes
        const observer = new MutationObserver(() => {
          updateConnectors();
        });
        
        observer.observe(card, {
          attributes: true,
          attributeFilter: ['style', 'class']
        });

        btn.addEventListener('click', function onClick(e) {
          e.stopPropagation();
          e.preventDefault();

          const currentDepth = parseInt(card.dataset.depth, 10);
          
          // Check if already expanded
          const nextElement = card.nextElementSibling;
          if (nextElement && nextElement.classList.contains('children-wrapper')) {
            // Remove children and their relationships
            const childUnits = nextElement.querySelectorAll('.child-unit');
            childUnits.forEach(unit => {
              const childCard = unit.querySelector('.card');
              if (childCard) {
                unregisterRelationship(childCard);
              }
            });
            nextElement.remove();
            updateConnectors();
            return;
          }

          if (currentDepth >= MAX_DEPTH) return;

          const wrapper = document.createElement('div');
          wrapper.className = 'children-wrapper';

          const parentName = card.dataset.name;
          const usedNames = [parentName];

          for (let i = 0; i < 2; i++) {
            const unit = document.createElement('div');
            unit.className = 'child-unit';
            
            let childName = randomName();
            while (usedNames.includes(childName)) {
              childName = randomName();
            }
            usedNames.push(childName);
            
            const childDesc = randomDescription();
            
            const childCard = createCard(currentDepth + 1, childName, childDesc, card, i === 0);
            unit.appendChild(childCard);
            wrapper.appendChild(unit);
          }

          card.insertAdjacentElement('afterend', wrapper);
          updateConnectors();
        });

        return card;
      }

      // Initialize
      function init() {
        const container = document.getElementById('treeContainer');
        container.innerHTML = '<canvas class="connector-canvas" id="connectorCanvas"></canvas>';
        
        setupCanvas();
        initPanning();
        
        const rootCard = createCard(0, 'You', 'Root User');
        rootCard.classList.add('root-card');
        container.appendChild(rootCard);
        
        updateConnectors();
      }

      // Start the app
      init();
    })();
  </script>
</body>
</html>
